# Перемотка стрелками (короткий шаг)
RIGHT seek 10
LEFT seek -10

# Перемотка с зажатым Shift (средний шаг для поиска мысли)
Shift+RIGHT seek 60
Shift+LEFT seek -60

# Перемотка с зажатым Ctrl (длинный шаг для пропуска глав)
Ctrl+RIGHT seek 300
Ctrl+LEFT seek -300

# Изменение скорости воспроизведения
[ add speed -0.1
] add speed 0.1
BS set speed 1.0

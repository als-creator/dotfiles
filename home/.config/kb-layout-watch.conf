# kb-layout-watch — раскладка клавиатуры по окну (X11).
# Читает скрипт ~/.local/bin/kb-layout-watch.sh.
#
# DEFAULT — раскладка по умолчанию для окон без совпавших правил.
# MODEL   — модель клавиатуры (как в XFCE keyboard-layout.xml).
# OPTIONS — переключатель группы и прочие xkb-опции.
# POLL_MS — интервал опроса активного окна.
#
# Правила: PATTERN=LAYOUT. PATTERN — регулярное выражение (без учёта регистра),
# которое ищется по заголовку окна (_NET_WM_NAME) и классу (WM_CLASS).
# При совпадении нескольких правил побеждает последнее.
#
# LAYOUT — основная раскладка окна: ru останавливает на раскладке «ru,us»,
# us — на «us,ru». Обе группы остаются доступны для ручного переключения
# (Ctrl+Shift), при смене фокуса активная группа возвращается к своей для окна.

DEFAULT=us
MODEL=logitech_base
OPTIONS=grp:ctrl_shift_toggle,compose:ralt
POLL_MS=300

opencode=ru